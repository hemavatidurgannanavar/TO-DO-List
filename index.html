<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <!-- Add Task Section -->
        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <input
                type="date"
                id="taskDate"
            >

            <input
                type="time"
                id="taskTime"
            >

            <button id="addBtn">
                Add Task
            </button>

        </div>

        <!-- Filter Buttons -->
        <div class="filters">

            <button
                class="filter active"
                data-filter="all">
                All
            </button>

            <button
                class="filter"
                data-filter="active">
                Active
            </button>

            <button
                class="filter"
                data-filter="completed">
                Completed
            </button>

        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Empty Message -->
        <p id="emptyMessage">
            No tasks yet. Add your first task!
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
